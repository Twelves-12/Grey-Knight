                <h1 class="site-title" tabindex="-1">东疆剿匪，心生疑云</h1>
                <p>
                  雷纳德公爵坐在高背椅上，指尖轻轻敲击着扶手。壁炉的火光映在他半张脸上，另一半隐入阴影。
                </p>
                <blockquote>“东部村落又遭劫了。阿尔德里克，你随我十一年，可曾见我亏待过子民？”</blockquote>
              </section>
              <section class="story-passage" hidden>
                <blockquote>“您待领地如父待子，人人皆知。”</blockquote>
                <blockquote>“那就替我肃清山匪。一个不留，清剿干净。”</blockquote>
                <p>
                  “遵命。”他起身时，瞥见公爵书桌一角压着张旧羊皮纸，上面有墨迹未干的数字——像是粮价，又像税目。他没多想，转身离去。
                </p>
