<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grey Knight · 卡牌图鉴</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <link rel="stylesheet" href="/css/cards.css" />
  </head>
  <body hidden>
    <div class="room site-room">
      <site-header active="cards"></site-header>
      <main class="site-scroll codex-page">
        <header class="codex-heading">
          <div>
            <h1 class="site-title">战线图鉴</h1>
          </div>
          <a class="btn" href="./story.html">冒险地图 →</a>
        </header>
        <form
          id="card-filters"
          class="codex-filters"
          role="search"
          aria-label="筛选卡牌"
        >
          <label class="field">
            搜索
            <input
              type="search"
              name="search"
              placeholder="名称、规则或铭文"
              autocomplete="off"
            />
          </label>
          <label class="field">
            阵营
            <select name="side">
              <option value="all">全部阵营</option>
              <option value="player">灰骑士</option>
              <option value="enemy">敌方</option>
            </select>
          </label>
          <label class="field">
            种属
            <select name="faction">
              <option value="all">全部种属</option>
              <option value="A">A · 人类与骑士</option>
              <option value="B">B · 蛮族与异兽</option>
              <option value="C">C · 民众与信仰</option>
            </select>
          </label>
          <label class="field">
            费用
            <select name="cost">
              <option value="all">全部费用</option>
              <option value="0">0 圣力</option>
              <option value="1">1 圣力</option>
              <option value="2">2 圣力</option>
              <option value="3">3 圣力</option>
            </select>
          </label>
          <label class="field">
            效果
            <select name="effect">
              <option value="all">全部效果</option>
              <option value="unit">单位与军令</option>
              <option value="tactic">战术</option>
              <option value="ritual">仪式</option>
              <option value="enhancement">强化</option>
              <option value="firstStrike">先手</option>
              <option value="piercing">穿透</option>
              <option value="sleep">沉睡</option>
              <option value="deploy">入场</option>
              <option value="draw">抽牌</option>
              <option value="energy">圣力</option>
              <option value="damageHero">伤害英雄</option>
              <option value="healHero">治疗英雄</option>
            </select>
          </label>
          <button id="clear-filters" class="btn" type="button">重置筛选</button>
        </form>
        <div class="codex-meta">
          <span id="card-count" role="status"></span>
        </div>
        <div id="card-grid" class="codex-grid"></div>
        <p id="card-empty" class="codex-empty sheet" hidden>
          没有符合条件的卡牌。
        </p>
        <noscript><p>图鉴需要 JavaScript 才能读取卡牌数据。</p></noscript>
      </main>
    </div>
    <script type="module" src="/game/entry.js"></script>
  </body>
</html>
