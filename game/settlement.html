<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grey Knight · 战后抉择</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <link rel="stylesheet" href="/css/journey.css" />
  </head>
  <body hidden>
    <div class="room site-room">
      <site-header active="game"></site-header>
      <main class="site-scroll journey-page">
        <div class="journey-topline">
          <a href="./map.html">← 冒险地图</a>
          <span id="settlement-chapter"></span>
        </div>
        <section class="map-panel sheet settlement-panel">
          <header class="event-heading">
            <span id="settlement-seal" class="event-seal" aria-hidden="true">
              誓
            </span>
            <h1 id="settlement-title" class="site-title"></h1>
            <p id="settlement-copy" hidden></p>
          </header>
          <div
            id="settlement-status"
            class="run-status"
            aria-live="polite"
          ></div>
          <ol id="settlement-steps" aria-label="结算步骤"></ol>
          <section
            id="settlement-story"
            class="settlement-context"
            aria-label="战后经过"
          ></section>
          <div id="settlement-step-heading" tabindex="-1"></div>
          <div id="settlement-receipt" hidden aria-live="polite"></div>
          <div id="settlement-summary" hidden aria-live="polite"></div>
          <section
            id="settlement-choices"
            class="settlement-choices"
            aria-label="战后选择"
          ></section>
          <section
            id="settlement-rewards"
            class="reward-section"
            aria-live="polite"
          ></section>
          <p
            id="settlement-outcome"
            class="settlement-next-note"
            aria-live="polite"
          ></p>
          <div class="map-actions">
            <button id="settlement-new" class="btn" type="button" hidden>
              开启新旅程
            </button>
            <button
              id="settlement-back"
              class="btn primary"
              type="button"
              disabled
            >
              完成选择后继续
            </button>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/game/entry.js"></script>
  </body>
</html>
