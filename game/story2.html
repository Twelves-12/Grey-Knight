<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grey Knight · 灰骑士的旅程</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <link rel="stylesheet" href="/css/journey.css" />
  </head>
  <body hidden>
    <div class="room site-room">
      <site-header active="game"></site-header>
      <main class="site-scroll journey-page">
        <div class="journey-topline">
          <a href="./map.html">← 冒险地图</a>
          <span id="story-topline-label"></span>
          <a id="story-skip" href="./battle.html">直接前往遭遇 →</a>
        </div>
        <article class="story-layout">
          <aside class="story-aside">
            <div class="story-scene chapter-scene" aria-hidden="true">
              <span class="scene-caption" id="story-location"></span>
            </div>
            <section class="story-brief" aria-labelledby="story-brief-title">
              <div class="story-brief-heading">
                <span id="story-brief-icon" aria-hidden="true"></span>
                <h2 id="story-brief-title">即将面对</h2>
              </div>
              <div
                id="story-encounter-stats"
                class="story-encounter-stats"
              ></div>
              <p id="story-encounter-rule"></p>
            </section>
          </aside>
          <div class="story-copy">
            <p id="story-eyebrow" class="eyebrow">GREY KNIGHT</p>
            <div class="story-reading">
              <span id="story-progress"></span>
              <progress
                id="story-meter"
                class="story-meter"
                aria-label="剧情阅读进度"
              ></progress>
            </div>
            <div id="story-passages" aria-live="polite"></div>
            <div id="story-run-status" class="run-status"></div>
            <p id="story-destination" class="story-destination"></p>
            <div class="story-controls">
              <button id="story-back" class="btn" type="button" disabled>
                上一段
              </button>
              <button id="story-next" class="btn primary" type="button">
                阅读下一段 →
              </button>
              <a
                id="story-enter"
                class="btn primary"
                href="./battle.html"
                hidden
              >
                进入战斗 →
              </a>
            </div>
          </div>
        </article>
      </main>
    </div>
    <script type="module" src="/game/entry.js"></script>
  </body>
</html>
