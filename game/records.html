<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grey Knight · 旅途记录</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <link rel="stylesheet" href="/css/journey.css" />
    <style>
      .records-page {
        padding: 24px 0 96px;
        max-width: 720px;
        margin: 0 auto;
      }

      .achievement-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 12px;
        margin-top: 16px;
      }

      .achievement-card {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 12px;
        border-radius: 8px;
        background: var(--bg-2);
        border: 1px solid var(--border-2);
        transition: border-color 0.2s;
      }

      .achievement-card.unlocked {
        border-color: var(--gold);
      }

      .achievement-card.locked {
        opacity: 0.5;
      }

      .achievement-card.in-progress {
        border-color: var(--accent);
        opacity: 0.8;
      }

      .achievement-seal {
        flex: 0 0 40px;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--bg-3);
        font-size: 20px;
      }

      .achievement-card.unlocked .achievement-seal {
        background: var(--gold);
        color: var(--bg-1);
      }

      .achievement-body {
        min-width: 0;
        flex: 1;
      }

      .achievement-body strong {
        display: block;
        font-size: 14px;
        line-height: 1.3;
        margin-bottom: 4px;
      }

      .achievement-body small {
        display: block;
        font-size: 12px;
        color: var(--text-2);
        line-height: 1.4;
      }

      .progress-track {
        height: 4px;
        border-radius: 2px;
        background: var(--bg-3);
        margin-top: 6px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        border-radius: 2px;
        background: var(--accent);
        transition: width 0.3s;
      }

      .progress-text {
        display: block;
        font-size: 11px;
        color: var(--text-3);
        margin-top: 4px;
      }

      .category-filters {
        display: flex;
        gap: 8px;
        margin: 16px 0;
        flex-wrap: wrap;
      }

      .category-filter {
        padding: 4px 14px;
        border-radius: 16px;
        border: 1px solid var(--border-2);
        background: var(--bg-2);
        font-size: 13px;
        cursor: pointer;
        color: var(--text-2);
        transition: all 0.2s;
      }

      .category-filter.active {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--bg-1);
      }

      .history-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 16px;
      }

      .history-card {
        padding: 14px 16px;
        border-radius: 8px;
      }

      .history-header {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 6px;
      }

      .history-index {
        font-size: 12px;
        color: var(--text-3);
        flex-shrink: 0;
      }

      .history-detail small {
        color: var(--text-3);
        font-size: 12px;
      }

      .section-gap {
        margin-top: 32px;
      }
    </style>
  </head>
  <body hidden>
    <div class="room site-room">
      <site-header active="game"></site-header>
      <main class="site-scroll records-page">
        <div class="journey-topline">
          <a href="./map.html">← 返回大地图</a>
          <span>旅途记录</span>
        </div>

        <!-- 当前旅程 -->
        <section class="map-panel sheet">
          <header class="event-heading">
            <p class="eyebrow">CURRENT JOURNEY</p>
            <h1 class="site-title">当前旅程</h1>
          </header>
          <div id="current-run-status" class="run-status"></div>
        </section>

        <!-- 成就 -->
        <section class="map-panel sheet section-gap">
          <header class="event-heading">
            <p class="eyebrow">ACHIEVEMENTS</p>
            <h1 class="site-title">成就</h1>
            <p id="achievement-summary" class="journey-note"></p>
          </header>
          <div id="achievement-categories" class="category-filters"></div>
          <div id="achievement-grid" class="achievement-grid"></div>
        </section>

        <!-- 历史旅程 -->
        <section class="map-panel sheet section-gap">
          <header class="event-heading">
            <p class="eyebrow">PAST JOURNEYS</p>
            <h1 class="site-title">历史旅程</h1>
            <p id="history-summary" class="journey-note"></p>
          </header>
          <div id="history-list" class="history-list"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/game/entry.js"></script>
  </body>
</html>
