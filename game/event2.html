<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grey Knight · 旅途歇脚处</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <link rel="stylesheet" href="/css/journey.css" />
  </head>
  <body hidden>
    <div class="room site-room">
      <site-header active="game"></site-header>
      <main class="site-scroll journey-page">
        <div class="journey-topline">
          <a href="./map.html">← 冒险地图</a>
        </div>
        <section class="map-panel sheet event-panel">
          <header class="event-heading">
            <span id="event-seal" class="event-seal" aria-hidden="true">
              途
            </span>
            <h1 id="event-title" class="site-title"></h1>
            <p id="event-description"></p>
          </header>
          <div
            id="event-status"
            class="resource-bar"
            aria-label="冒险资源"
          ></div>
          <section
            id="event-notice"
            role="status"
            aria-live="polite"
            tabindex="-1"
            hidden
          ></section>
          <div class="action-section-heading">
            <div>
              <h2 id="event-action-title">选择行动</h2>
              <p id="event-action-hint"></p>
            </div>
          </div>
          <section
            id="event-actions"
            class="service-options"
            aria-label="旅途行动"
          ></section>
          <div class="map-actions">
            <button id="event-continue" class="btn primary" type="button">
              离开 →
            </button>
          </div>
          <details id="event-deck" class="service-deck deck-disclosure">
            <summary id="event-deck-summary">冒险牌组</summary>
            <div id="event-deck-list" class="deck-ledger"></div>
          </details>
        </section>
      </main>
    </div>
    <script type="module" src="/game/entry.js"></script>
  </body>
</html>
