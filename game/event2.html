<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grey Knight · 节点抉择</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <link rel="stylesheet" href="/css/journey.css" />
  </head>
  <body hidden>
    <div class="room site-room">
      <site-header active="game"></site-header>
      <main class="site-scroll journey-page">
        <div class="journey-topline">
          <a href="./story2.html">← 返回剧情</a>
          <span id="event-topline-label">节点抉择</span>
        </div>
        <header class="event-heading">
          <span class="event-seal" aria-hidden="true">誓</span>
          <p class="eyebrow">A CHOICE BEFORE THE DARK</p>
          <h1 id="event-title" class="site-title">节点抉择</h1>
          <p id="event-description">
            你站在分叉处，前方的灰暗与火光正交织。<br />
            每一种选择，都会改变你走向未知的方式。
          </p>
        </header>

        <form id="event-form" class="event-form" action="./battle.html" method="get">
          <fieldset>
            <legend>你要怎么做？</legend>
            <div id="event-choices" class="event-choices"></div>
          </fieldset>
          <section id="event-outcome" class="event-outcome sheet" aria-live="polite" hidden>
            <p id="event-aftermath"></p>
            <div class="outcome-stats">
              <span>
                开局生命
                <b id="event-health"></b>
              </span>
              <span>
                牌库
                <b id="event-deck"></b>
              </span>
            </div>
            <p class="event-note">
              加入的卡牌会一起洗入牌库，不保证出现在起手牌中。
            </p>
          </section>
          <div class="event-actions">
            <span>选择后，可在出发前更改。</span>
            <button id="event-continue" class="btn primary" type="submit" disabled>
              进入战斗 →
            </button>
          </div>
        </form>
      </main>
    </div>
    <script type="module" src="/game/entry.js"></script>
  </body>
</html>
