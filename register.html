<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grey Knight · 注册</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body>
    <div class="site-room auth-room">
      <site-header></site-header>

      <main class="site-scroll">
        <section class="auth-shell">
          <div class="sheet auth-card">
            <h1 class="site-title">注册</h1>
            <form class="auth-form" data-auth-form="register" novalidate>
              <label class="field">
                <span>用户名</span>
                <input name="username" type="text" autocomplete="username" />
              </label>
              <label class="field">
                <span>密码</span>
                <input
                  name="password"
                  type="password"
                  autocomplete="new-password"
                />
              </label>
              <button class="btn primary auth-submit" type="submit">
                注册
              </button>
            </form>
            <p class="auth-foot">
              已有账号？
              <a href="./login.html">去登录</a>
            </p>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/js/site.js"></script>
    <script type="module" src="/js/auth.js"></script>
  </body>
</html>
